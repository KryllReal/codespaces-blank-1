<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>maxitom &middot; Hardener</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="fengari-web.js"></script>
    <script src="prometheus_bundle.js"></script>
    <script>var require = { paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } };</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary: #000;
        npm    --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }
        body { overflow: hidden; display: flex; flex-direction: column; height: 100vh; background: #0a0a0a; color: #fff; font-family: 'Inter', sans-serif; }
        
        .obf-header { 
            padding: 1.25rem 2rem; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #0a0a0a;
            position: relative;
        }
        
        .logo { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.2rem; display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 28px; height: 28px; color: #fff; }
        
        .obf-main { flex: 1; display: flex; gap: 1.5rem; padding: 1.5rem; background: #000; }
        .obf-pane { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: #0a0a0a; 
            border: 1px solid rgba(255,255,255,0.05); 
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        
        .obf-pane-header { 
            padding: 1rem 1.25rem; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            font-size: 0.75rem; 
            font-weight: 700; 
            color: rgba(255,255,255,0.4); 
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(255,255,255,0.02);
        }
        
        .obf-editor { flex: 1; width: 100%; height: 100%; }
        
        .btn-primary {
            background: #fff;
            color: #000;
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: 10px;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255,255,255,0.1); }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-sm {
            padding: 4px 12px;
            font-size: 11px;
            background: #111;
            color: #fff;
            border: 1px solid #222;
        }

        /* Progress Bar Styles */
        .progress-container { position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: transparent; overflow: hidden; z-index: 10; display: none; }
        .progress-bar { height: 100%; width: 0%; background: #fff; transition: width 0.3s ease; }
        .is-obfuscating .progress-container { display: block; }
        .is-obfuscating .progress-bar { animation: progress-indet 1.5s infinite linear; }
        
        @keyframes progress-indet {
            0% { width: 0%; left: 0; }
            50% { width: 40%; left: 30%; }
            100% { width: 0%; left: 100%; }
        }

        .unauth-overlay { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .unauth-overlay h1 { font-family: 'Outfit', sans-serif; font-size: 2.5rem; font-weight: 900; margin-bottom: 0.5rem; }
    </style>
</head>
<body class="dark-mode">
    <div id="unauthOverlay" class="unauth-overlay">
        <h1 style="letter-spacing: -0.04em;">Antigravity</h1>
        <p style="color: #444; font-size: 0.9rem;">Initializing Hardener Interface...</p>
    </div>

    <div id="app" class="hidden" style="height: 100%; display: flex; flex-direction: column;">
        <header class="obf-header">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="4" cy="4" r="0.4" class="star s1"></circle>
                        <circle cx="20" cy="5" r="0.3" class="star s2"></circle>
                        <circle cx="18" cy="20" r="0.4" class="star s3"></circle>
                        <circle cx="5" cy="16" r="0.3" class="star s4"></circle>
                        <circle cx="12" cy="12" r="4.5" class="saturn-planet"></circle>
                        <ellipse cx="12" cy="12" rx="9" ry="3" class="saturn-rings r1"></ellipse>
                        <ellipse cx="12" cy="12" rx="11.5" ry="4.2" class="saturn-rings r2"></ellipse>
                        <g class="moon-system"><circle cx="12" cy="4" r="0.8" class="saturn-moon"></circle></g>
                    </svg>
                </div>
                Antigravity <span style="color: #444; font-weight: 400; margin-left: 4px;">Hardener</span>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <div id="engineStatus" style="display: flex; align-items: center; gap: 8px; padding: 4px 12px; background: #111; border: 1px solid #222; border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #444;">
                    <div id="engineStatusDot" style="width: 6px; height: 6px; border-radius: 50%; background: #ebad00; box-shadow: 0 0 10px #ebad00; animation: status-pulse 1.5s infinite;"></div>
                    Engine: <span id="engineStatusText">Initializing</span>
                </div>

                <div style="display: flex; align-items: center; gap: 8px; margin: 0 0.5rem;">
                    <span style="font-size: 10px; font-weight: 700; color: #444; text-transform: uppercase; letter-spacing: 0.05em;">Virtualization</span>
                    <label class="switch">
                        <input type="checkbox" id="vmToggle" checked>
                        <span class="slider round"></span>
                    </label>
                </div>

                <button class="btn-sm btn-primary" style="background: #111; color: #fff; border: 1px solid #222;" onclick="window.location.href='/'">Back to Registry</button>
                <button class="btn-primary" id="obfuscateBtn" disabled>Obfuscate Code</button>
            </div>
            <style>
                @keyframes status-pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
                .engine-ready #engineStatusDot { background: #10b981; box-shadow: 0 0 10px #10b981; animation: none; }
                .engine-ready #engineStatus { color: #fff; }

                /* Toggle Switch Styles */
                .switch { position: relative; display: inline-block; width: 32px; height: 18px; }
                .switch input { opacity: 0; width: 0; height: 0; }
                .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #111; border: 1px solid #222; transition: .3s; border-radius: 20px; }
                .slider:before { position: absolute; content: ""; height: 10px; width: 10px; left: 3px; bottom: 3px; background-color: #444; transition: .3s; border-radius: 50%; }
                input:checked + .slider { background-color: #fff; border-color: #fff; }
                input:checked + .slider:before { background-color: #000; transform: translateX(14px); }
            </style>
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
        </header>
        
        <main class="obf-main">
            <div class="obf-pane">
                <div class="obf-pane-header">Input Source (Luau)</div>
                <div id="inputEditor" class="obf-editor"></div>
            </div>
            <div class="obf-pane">
                <div class="obf-pane-header">
                    <span>Prometheus Result</span>
                    <button class="btn btn-sm" id="copyBtn" style="border-radius: 6px;">Copy Output</button>
                </div>
                <div id="outputEditor" class="obf-editor"></div>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toasts"></div>
    <script src="obfuscator.js"></script>
</body>
</html>
