<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>maxitom &middot; Checkpoint</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #ffffff; 
            color: #000000; 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }
        .container { text-align: center; max-width: 440px; width: 100%; }
        
        .card { 
            background: #ffffff; 
            border: 1px solid #eeeeee; 
            border-radius: 28px; 
            padding: 48px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.02);
            position: relative;
        }
        
        .badge { 
            font-family: 'Outfit', sans-serif;
            font-size: 10px; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 0.1em; 
            color: #888888; 
            background: #fafafa; 
            padding: 6px 14px; 
            border-radius: 10px; 
            border: 1px solid #eeeeee; 
            display: inline-block; 
            margin-bottom: 24px; 
        }
        
        h1 { 
            font-family: 'Outfit', sans-serif;
            font-size: 28px; 
            font-weight: 900; 
            letter-spacing: -0.04em; 
            margin-bottom: 12px; 
            color: #000;
        }
        p { 
            color: #444444; 
            font-size: 14px; 
            line-height: 1.6; 
            margin-bottom: 32px; 
        }

        .timer-container { margin-bottom: 32px; }
        .timer-circle { 
            width: 72px; 
            height: 72px; 
            border: 4px solid #f5f5f5; 
            border-top-color: #000; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0 auto 16px; 
            font-family: 'Outfit', sans-serif;
            font-size: 20px; 
            font-weight: 800; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .btn { 
            background: #000; 
            color: #fff; 
            border: none; 
            padding: 16px 32px; 
            border-radius: 16px; 
            font-family: 'Outfit', sans-serif;
            font-weight: 800; 
            font-size: 14px; 
            cursor: pointer; 
            transition: all 0.2s; 
            display: none; 
            width: 100%; 
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .key-display { 
            background: #fafafa; 
            border: 1px solid #eeeeee; 
            padding: 24px; 
            border-radius: 18px; 
            margin-top: 24px; 
            display: none; 
        }
        .key-label { 
            font-family: 'Outfit', sans-serif;
            font-size: 10px; 
            font-weight: 800; 
            color: #888888; 
            text-transform: uppercase; 
            letter-spacing: 0.1em;
            margin-bottom: 8px; 
        }
        .key-value { 
            font-family: 'SF Mono', 'JetBrains Mono', monospace; 
            font-size: 18px; 
            font-weight: 800; 
            color: #000; 
            letter-spacing: 0.05em; 
        }

        .footer { 
            font-family: 'Outfit', sans-serif;
            font-size: 10px; 
            font-weight: 800; 
            color: #cccccc; 
            letter-spacing: 0.2em; 
            margin-top: 40px; 
            text-transform: uppercase; 
        }

        @media (max-width: 600px) {
            body { padding: 16px; }
            .card { padding: 32px 24px; border-radius: 24px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <span class="badge">Verification Checkpoint</span>
            <h1 id="title">Unlocking Script</h1>
            <p id="desc">Please wait while we verify your request. This helps support the platform and keep it free for everyone.</p>

            <div class="timer-container" id="timerSection">
                <div class="timer-circle" id="timer">15</div>
                <div style="font-size: 10px; font-weight: 800; color: #aaaaaa; text-transform: uppercase; letter-spacing: 0.1em;">Seconds Remaining</div>
            </div>

            <button class="btn" id="verifyBtn">Continue to Key</button>

            <div class="key-display" id="keyDisplay">
                <div class="key-label">Your Temporary Key</div>
                <div class="key-value" id="keyValue">XXXX-XXXX-XXXX</div>
                <p style="font-size: 11px; margin: 16px 0 0; color: #888;">Copy this key and enter it in the Roblox prompt.</p>
            </div>
        </div>
        <div class="footer">Antigravity ad-gate</div>
    </div>

    <script>
        let timeLeft = 15;
        const timerEl = document.getElementById('timer');
        const verifyBtn = document.getElementById('verifyBtn');
        const timerSection = document.getElementById('timerSection');
        const keyDisplay = document.getElementById('keyDisplay');
        const keyValue = document.getElementById('keyValue');
        const title = document.getElementById('title');
        const desc = document.getElementById('desc');

        const params = new URLSearchParams(window.location.search);
        const scriptId = params.get('s');
        const ticketId = params.get('t');

        const countdown = setInterval(() => {
            timeLeft--;
            timerEl.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerSection.style.display = 'none';
                verifyBtn.style.display = 'block';
                title.textContent = 'Ready to Generate';
            }
        }, 1000);

        verifyBtn.onclick = async () => {
            window.open('https://example.com/your-ad-link-here', '_blank');
            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Generating...';
            
            try {
                const r = await fetch(`/api/checkpoint/verify?s=${scriptId}&t=${ticketId}`, { method: 'POST' });
                const j = await r.json();
                if (j.success) {
                    verifyBtn.style.display = 'none';
                    keyDisplay.style.display = 'block';
                    keyValue.textContent = j.key;
                    title.textContent = 'Key Generated';
                    desc.textContent = 'Your session key is ready. Copy it below.';
                } else {
                    alert(j.error || 'Verification failed');
                    verifyBtn.disabled = false;
                    verifyBtn.textContent = 'Continue to Key';
                }
            } catch (e) {
                alert('Connection error');
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Continue to Key';
            }
        };
    </script>
</body>
</html>
